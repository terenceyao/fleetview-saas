</head>

<!-- ============ 应用外壳 ============ -->
<div class="app" id="app">

  <!-- 移动端侧边栏遮罩 -->
  <div class="sidebar-mask" id="sidebarMask"></div>

  <!-- 侧边栏 -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 32 32" width="30" height="30"><rect width="32" height="32" rx="9" fill="url(#bg1)"/><defs><linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1B2740"/><stop offset="1" stop-color="#0E1626"/></linearGradient></defs><path d="M7 21l5.5-10 3.2 5.4L19 12l6 9z" fill="#E88828"/><circle cx="24.5" cy="9" r="3.2" fill="#2AC2F3"/></svg>
      </div>
      <div class="brand-text">
        <div class="brand-name">FleetView</div>
        <div class="brand-sub">车联网 SaaS 控制台</div>
      </div>
    </div>

    <nav class="nav" id="nav">
      <div class="nav-group">运营中心</div>
      <button type="button" class="nav-item" data-page="overview"><svg class="ico"><use href="#i-dash"/></svg><span>总览看板</span></button>
      <button type="button" class="nav-item" data-page="devices"><svg class="ico"><use href="#i-device"/></svg><span>设备管理</span><em class="nav-badge" id="nb-devices"></em></button>
      <button type="button" class="nav-item" data-page="map"><svg class="ico"><use href="#i-map"/></svg><span>实时地图</span></button>
      <button type="button" class="nav-item" data-page="alerts"><svg class="ico"><use href="#i-alert"/></svg><span>告警中心</span><em class="nav-badge warn" id="nb-alerts"></em></button>
      <button type="button" class="nav-item" data-page="trips"><svg class="ico"><use href="#i-trip"/></svg><span>行程与里程</span></button>
      <button type="button" class="nav-item" data-page="geofence"><svg class="ico"><use href="#i-fence"/></svg><span>围栏管理</span></button>
      <div class="nav-group">视频与智能</div>
      <button type="button" class="nav-item" data-page="video"><svg class="ico"><use href="#i-video"/></svg><span>实时视频</span></button>
      <button type="button" class="nav-item" data-page="obd"><svg class="ico"><use href="#i-gauge"/></svg><span>OBD 数据分析</span></button>
      <button type="button" class="nav-item" data-page="adas"><svg class="ico"><use href="#i-shield"/></svg><span>ADAS·DMS 智能筛选</span></button>
      <div class="nav-group">平台资源</div>
      <button type="button" class="nav-item" data-page="platform"><svg class="ico"><use href="#i-gateway"/></svg><span>网关与模型</span></button>
      <button type="button" class="nav-item" data-page="media"><svg class="ico"><use href="#i-media"/></svg><span>媒体资源</span></button>
      <div class="nav-group">开发者</div>
      <button type="button" class="nav-item" data-page="console"><svg class="ico"><use href="#i-code"/></svg><span>API 控制台</span></button>
      <button type="button" class="nav-item" data-page="settings"><svg class="ico"><use href="#i-cog"/></svg><span>接入设置</span></button>
    </nav>

    <div class="sidebar-foot">
      <div class="src-status" id="srcStatus">
        <div class="src-row" data-src="th"><i class="dot"></i><span>TurboHive</span><b>未连接</b></div>
        <div class="src-row" data-src="tsp"><i class="dot"></i><span>TrackSolidPro</span><b>未连接</b></div>
      </div>
    </div>
  </aside>

  <!-- 主区 -->
  <div class="main">
    <header class="topbar">
      <button class="icon-btn only-mobile" id="menuBtn" title="菜单" aria-label="菜单"><svg class="ico"><use href="#i-menu"/></svg></button>
      <div class="crumb">
        <h1 id="pageTitle">总览看板</h1>
        <p id="pageDesc">双平台车队数据统一视图</p>
      </div>
      <div class="topbar-tools">
        <div class="seg" id="langSeg" title="Language / 语言">
          <button data-lang="zh" class="on">中</button>
          <button data-lang="en">EN</button>
          <button data-lang="es">ES</button>
        </div>
        <div class="live-pill" id="livePill" title="自动刷新">
          <i class="dot"></i><span id="liveText">实时</span>
        </div>
        <div class="seg" id="rangeSeg">
          <button data-range="24" class="on">24H</button>
          <button data-range="168">7D</button>
          <button data-range="720">30D</button>
        </div>
        <button class="btn" id="refreshBtn"><svg class="ico"><use href="#i-refresh"/></svg><span>刷新</span></button>
      </div>
    </header>

    <main class="content" id="content">
      <section class="page" id="page-overview"></section>
      <section class="page" id="page-devices"></section>
      <section class="page" id="page-map"></section>
      <section class="page" id="page-alerts"></section>
      <section class="page" id="page-trips"></section>
      <section class="page" id="page-geofence"></section>
      <section class="page" id="page-video"></section>
      <section class="page" id="page-obd"></section>
      <section class="page" id="page-adas"></section>
      <section class="page" id="page-platform"></section>
      <section class="page" id="page-media"></section>
      <section class="page" id="page-console"></section>
      <section class="page" id="page-settings"></section>
    </main>
  </div>
</div>

<!-- 抽屉 -->
<div class="drawer-mask" id="drawerMask"></div>
<aside class="drawer" id="drawer">
  <div class="drawer-head">
    <h3 id="drawerTitle">详情</h3>
    <button class="icon-btn" id="drawerClose" aria-label="关闭" title="关闭"><svg class="ico"><use href="#i-close"/></svg></button>
  </div>
  <div class="drawer-body" id="drawerBody"></div>
</aside>

<!-- 全局提示 -->
<div class="toasts" id="toasts"></div>

<!-- 启动遮罩 -->
<div class="boot" id="boot">
  <div class="boot-inner">
    <svg viewBox="0 0 32 32" width="52" height="52"><rect width="32" height="32" rx="9" fill="#131C2E"/><path d="M7 21l5.5-10 3.2 5.4L19 12l6 9z" fill="#E88828"/><circle cx="24.5" cy="9" r="3.2" fill="#2AC2F3"/></svg>
    <div class="boot-title">FleetView 控制台</div>
    <div class="boot-bar"><i></i></div>
    <div class="boot-msg" id="bootMsg">正在初始化…</div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/flv.js@1.6.2/dist/flv.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/util.js"></script>
<script src="assets/js/charts.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/pages.js"></script>
<script src="assets/js/pages2.js"></script>
<script src="assets/js/pages3.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
